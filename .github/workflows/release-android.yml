# Mode for Android, on the phone app's release. tools/release-app.sh makes the draft release
# Mode-Mobile-Build-<version> on a Mac (the iPhone builds need Xcode) and pushes the tag; this adds the
# Android APK to that draft. Run it by hand (Actions → Run workflow) to build without a release.
#
# The APK is signed with the repository secrets MODE_ANDROID_KEYSTORE_BASE64 (the .jks, base64),
# MODE_ANDROID_KEYSTORE_PASSWORD and MODE_ANDROID_KEY_ALIAS; without them it is built unsigned and not
# attached (Android can't update an app from an unsigned or differently signed APK).
name: Release · Mode for Android

on:
  push:
    tags: ["Mode-Mobile-Build-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        id: key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MODE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mode.jks"
            echo "path=$RUNNER_TEMP/mode.jks" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Mode for Android
        env:
          MODE_ANDROID_KEYSTORE: ${{ steps.key.outputs.path }}
          MODE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MODE_ANDROID_KEYSTORE_PASSWORD }}
          MODE_ANDROID_KEY_ALIAS: ${{ secrets.MODE_ANDROID_KEY_ALIAS }}
          MODE_ANDROID_KEY_PASSWORD: ${{ secrets.MODE_ANDROID_KEY_PASSWORD }}
        run: tools/build-apk.sh full release
      - uses: actions/upload-artifact@v4
        with:
          name: mode-android
          path: dist/*
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/Mode-Mobile-Build-') && steps.key.outputs.path != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/Mode.apk dist/Mode.apk.sha256 --clobber
