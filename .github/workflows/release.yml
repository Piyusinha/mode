# Mode Setup for Windows and Linux, and Mode for Android. tools/release.sh makes the draft release on a
# Mac (Mode's .ipa files and the Mac .dmg need Xcode) and pushes the tag; this adds the Windows and Linux
# installers and the Android APK to that draft. Run it by hand (Actions → Run workflow) to build without
# a release.
#
# The APK is signed with the repository secrets MODE_ANDROID_KEYSTORE_BASE64 (the .jks, base64),
# MODE_ANDROID_KEYSTORE_PASSWORD and MODE_ANDROID_KEY_ALIAS; without them it is built unsigned and not
# attached (Android can't update an app from an unsigned or differently signed APK).
name: Release · Mode Setup for Windows and Linux, Mode for Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mode-setup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libdbus-1-dev libudev-dev pkg-config patchelf
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build Mode Setup
        working-directory: desktop/setup-app
        run: cargo tauri build
      - name: Collect installers
        shell: bash
        run: |
          mkdir out
          find desktop/target/release/bundle \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mode-setup-${{ runner.os }}
          path: out/*
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        id: key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MODE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mode.jks"
            echo "path=$RUNNER_TEMP/mode.jks" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Mode for Android
        env:
          MODE_ANDROID_KEYSTORE: ${{ steps.key.outputs.path }}
          MODE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MODE_ANDROID_KEYSTORE_PASSWORD }}
          MODE_ANDROID_KEY_ALIAS: ${{ secrets.MODE_ANDROID_KEY_ALIAS }}
          MODE_ANDROID_KEY_PASSWORD: ${{ secrets.MODE_ANDROID_KEY_PASSWORD }}
        run: tools/build-apk.sh full release
      - uses: actions/upload-artifact@v4
        with:
          name: mode-android
          path: dist/*
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v') && steps.key.outputs.path != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/Mode.apk dist/Mode.apk.sha256 --clobber
