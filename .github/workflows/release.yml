# Mode Setup for Windows and Linux. tools/release-setup.sh makes the draft release Mode-Desktop-App-<version>
# on a Mac (the .dmg is signed and notarized there) and pushes the tag; this adds the Windows and
# Linux installers to that draft, each carrying the newest published Mode. Run it by hand
# (Actions → Run workflow) to build without a release.
name: Release · Mode Setup for Windows and Linux

on:
  push:
    tags: ["Mode-Desktop-App-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mode-setup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libdbus-1-dev libudev-dev pkg-config patchelf
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      # The newest published Mode (.ipa files, checked against their .sha256, and Mode.version), to
      # carry inside Mode Setup: the same script the Mac build uses.
      - name: The newest Mode, to carry inside
        if: startsWith(github.ref, 'refs/tags/Mode-Desktop-App-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/latest-app-release.sh
      - name: Build Mode Setup
        working-directory: desktop/setup-app
        shell: bash
        run: |
          if [ -f ../../build/release/Mode.ipa ]; then
            cargo tauri build --config tauri.release.conf.json
          else
            cargo tauri build   # a test build by hand: Mode is downloaded at setup instead
          fi
      # Fixed names, so the README can link to releases/latest/download/<name>, plus versioned copies.
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir out
          V=${GITHUB_REF_NAME#Mode-Desktop-App-}
          [ "$V" != "$GITHUB_REF_NAME" ] || V=dev
          if [ "$RUNNER_OS" = Windows ]; then OSN=windows; else OSN=linux; fi
          take() {  # $1 = pattern, $2 = extension
            f=$(find desktop/target/release/bundle -name "$1" | head -1)
            [ -n "$f" ] || { echo "no $1"; exit 1; }
            cp "$f" "out/Mode-Setup-$OSN.$2"
            cp "$f" "out/Mode-Setup-$V-$OSN.$2"
          }
          if [ "$OSN" = windows ]; then
            take '*-setup.exe' exe
            take '*.msi' msi
          else
            take '*.AppImage' AppImage
            take '*.deb' deb
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mode-setup-${{ runner.os }}
          path: out/*
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/Mode-Desktop-App-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber
