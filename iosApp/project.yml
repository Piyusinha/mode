name: Mode
options:
  bundleIdPrefix: com.piyush.mode
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: BH9TWW5HPR
  MARKETING_VERSION: "0.1"
  CURRENT_PROJECT_VERSION: "1"
targets:
  Mode:
    type: application
    platform: iOS
    sources:
      - path: Mode
    info:
      # Keys Xcode's generated plist has no build setting for; merged with it.
      path: Mode/Info.plist
      properties:
        # Compose refuses to start without it on 120 Hz iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        # Mode's Documents show in the Files app and in Finder, so the pairing
        # file can also be dropped in by hand (free accounts, no Mac tools).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The loopback-VPN route reaches the phone's pairing service as a local-network peer.
        NSLocalNetworkUsageDescription: Mode connects to this iPhone's own developer services to see the screen and tap for you. Nothing leaves the phone.
    preBuildScripts:
      # Builds the Kotlin side (ModeKit.framework) for the SDK and configuration Xcode is building.
      - name: Build ModeKit
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle: OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    postCompileScripts:
      # Apple's developer disk image from this Mac's Xcode, so Mode can remount
      # it after the phone restarts (shared/phone-coredevice: PhoneConnector).
      - name: Bundle developer disk image
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/../tools/bundle-ddi.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/DDI"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.piyush.mode
      PRODUCT_NAME: Mode
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Mode
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_MACCATALYST: NO
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      FRAMEWORK_SEARCH_PATHS:
        - "$(inherited)"
        - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
schemes:
  Mode:
    build:
      targets:
        Mode: all
