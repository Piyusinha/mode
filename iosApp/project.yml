name: Mode
options:
  bundleIdPrefix: ${MODE_BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
packages:
  # Mode's design system: every colour, font, size, icon and component screens use.
  ModeDesignSystem:
    path: Packages/ModeDesignSystem
settings:
  SWIFT_VERSION: "5.0"
  CODE_SIGN_STYLE: Automatic
  # Your team and app ID come from iosApp/Signing.env (see Signing.example.env); tools/gen-project.sh reads it.
  DEVELOPMENT_TEAM: ${MODE_TEAM}
  MARKETING_VERSION: "0.1.8"
  CURRENT_PROJECT_VERSION: "1"
targets:
  Mode:
    type: application
    platform: iOS
    sources:
      - path: Mode
      # The Live Activity's model, Stop intent, strings and views, shared with ModeWidgets.
      - path: Shared
    info:
      # Keys Xcode's generated plist has no build setting for; merged with it.
      path: Mode/Info.plist
      properties:
        # Compose refuses to start without it on 120 Hz iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        # Mode's Documents show in the Files app and in Finder, so the pairing
        # file can also be dropped in by hand (free accounts, no Mac tools).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The loopback-VPN route reaches the phone's pairing service as a local-network peer.
        # Silent, mixable audio keeps Mode running while it drives other apps.
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: Mode connects to this iPhone's own developer services to see the screen and tap for you. Nothing leaves the phone.
        NSMicrophoneUsageDescription: Mode listens when you speak a task, and stops before it starts working in your apps.
        NSCalendarsFullAccessUsageDescription: Mode reads your calendar when a task needs it (your flight tomorrow, your next meeting), instead of tapping through the Calendar app.
        NSContactsUsageDescription: Mode looks up a person's number or email when a task needs it, instead of tapping through Contacts.
        # The running task on the Dynamic Island and the Lock Screen.
        NSSupportsLiveActivities: true
        # Mode updates the activity at every step while it works.
        NSSupportsLiveActivitiesFrequentUpdates: true
        # mode:// links: the Live Activity's Open chat and Another task.
        CFBundleURLTypes:
          - CFBundleURLName: ${MODE_BUNDLE_PREFIX}
            CFBundleURLSchemes:
              - mode
        # A Mode backup (.modebackup), made in Settings → Backup and restore: Files shows only these when restoring.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ${MODE_BUNDLE_PREFIX}.backup
            UTTypeDescription: Mode backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [modebackup]
    dependencies:
      - package: ModeDesignSystem
      - target: ModeWidgets
    preBuildScripts:
      # Screens use the design system and the string catalog, never literals.
      - name: Check UI literals
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/../tools/check-ui-literals.sh"
      # Builds the Kotlin side (ModeKit.framework) for the SDK and configuration Xcode is building.
      - name: Build ModeKit
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle: OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :app:kit:embedAndSignAppleFrameworkForXcode
    postCompileScripts:
      # Apple's developer disk image from this Mac's Xcode, so Mode can remount
      # it after the phone restarts (engine/phone-ios: PhoneConnector).
      - name: Bundle developer disk image
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/../tools/bundle-ddi.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/DDI"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${MODE_BUNDLE_PREFIX}
      PRODUCT_NAME: Mode
      # Swift symbols for the string catalog's keys.
      STRING_CATALOG_GENERATE_SYMBOLS: YES
      LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      SWIFT_EMIT_LOC_STRINGS: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # ModeKit's database uses the system SQLite.
      OTHER_LDFLAGS:
        - "$(inherited)"
        - "-lsqlite3"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Mode
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_MACCATALYST: NO
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      FRAMEWORK_SEARCH_PATHS:
        - "$(inherited)"
        - "$(SRCROOT)/../app/kit/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
  # The Live Activity (Dynamic Island, Lock Screen, Watch Smart Stack). Needs no
  # special entitlement, so free and paid accounts both get it.
  ModeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ModeWidgets
      - path: Shared
    info:
      path: ModeWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - package: ModeDesignSystem
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${MODE_BUNDLE_PREFIX}.widgets
      PRODUCT_NAME: ModeWidgets
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Mode
      TARGETED_DEVICE_FAMILY: "1"
      SKIP_INSTALL: YES
      LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  Mode:
    build:
      targets:
        Mode: all
