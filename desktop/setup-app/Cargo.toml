[package]
name = "mode-setup-app"
description = "Mode Setup: the window app that installs Mode on an iPhone (Mac, Windows, Linux)."
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "mode-setup-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mode-setup-core = { path = "../setup-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49", features = ["sync", "time", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
open = "5"
dirs = "6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
