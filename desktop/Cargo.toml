# Mode Setup: the desktop app that installs Mode on an iPhone. Its own workspace, so its
# idevice pin never moves native/modecore's (docs/mac-windows-setup-plan.md).
[workspace]
resolver = "3"
members = ["setup-core", "setup-cli", "setup-app"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.6"

[workspace.dependencies]
idevice = { version = "0.1.68", features = ["usbmuxd", "house_arrest", "afc", "amfi", "installation_proxy", "core_device_proxy", "remote_pairing", "tcp", "tunnel_tcp_stack", "xpc", "rsd", "pair"] }
isideload = { version = "0.5.2", default-features = false, features = ["install", "keyring-storage", "tokio-mt"] }
