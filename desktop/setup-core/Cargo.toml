[package]
name = "mode-setup-core"
description = "Installs Mode on an iPhone, gets phone control ready, optionally installs SideStore."
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
idevice.workspace = true
isideload.workspace = true
plist = "1.8"
plist-macro = "0.1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.49", features = ["fs", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json", "stream"] }
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
tracing = "0.1"
rootcause = "0.12"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
